name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  build:
    name: build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Matchbook.slnx

      - name: Build
        run: dotnet build Matchbook.slnx --configuration Release --no-restore

      # Whitespace and style only. Analyzer-level style is already enforced by EnforceCodeStyleInBuild with
      # warnings as errors, so the full formatter would build a second workspace for no benefit.
      - name: Verify formatting
        run: |
          dotnet format whitespace Matchbook.slnx --verify-no-changes --no-restore
          dotnet format style Matchbook.slnx --verify-no-changes --no-restore

      # Reads the licence of every package in the tree, at every depth, from the restored packages on disk.
      - name: Audit dependency licences
        run: dotnet run --project tools/Matchbook.LicenseAudit --configuration Release --no-build -- .

      - name: Architecture
        run: dotnet run --project tests/Matchbook.ArchitectureTests --configuration Release --no-build

      - name: Unit tests
        run: |
          for service in Suppliers Budgets Requisitions Purchasing Payables; do
            dotnet run --project "tests/Services/$service/Matchbook.$service.UnitTests" --configuration Release --no-build
          done

  integration:
    name: integration (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite:
          - tests/Matchbook.BuildingBlocks.Tests
          - tests/Services/Suppliers/Matchbook.Suppliers.IntegrationTests
          - tests/Services/Budgets/Matchbook.Budgets.IntegrationTests
          - tests/Services/Requisitions/Matchbook.Requisitions.IntegrationTests
          - tests/Services/Purchasing/Matchbook.Purchasing.IntegrationTests
          - tests/Services/Payables/Matchbook.Payables.IntegrationTests
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Real Postgres and real RabbitMQ in containers. The claims under test are about the outbox, the inbox,
      # constraints and concurrency, and an in-memory substitute would prove none of them.
      - name: Integration tests
        run: dotnet run --project ${{ matrix.suite }} --configuration Release
