name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  build:
    name: build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Matchbook.slnx

      - name: Build
        run: dotnet build Matchbook.slnx --configuration Release --no-restore

      # Whitespace and style only. Analyzer-level style is already enforced by EnforceCodeStyleInBuild with
      # warnings as errors, so the full formatter would build a second workspace for no benefit.
      - name: Verify formatting
        run: |
          dotnet format whitespace Matchbook.slnx --verify-no-changes --no-restore
          dotnet format style Matchbook.slnx --verify-no-changes --no-restore

      # Reads the licence of every package in the tree, at every depth, from the restored packages on disk.
      - name: Audit dependency licences
        run: dotnet run --project tools/Matchbook.LicenseAudit --configuration Release --no-build -- .

      - name: Architecture
        run: dotnet run --project tests/Matchbook.ArchitectureTests --configuration Release --no-build

      - name: Unit tests
        run: |
          for service in Suppliers Budgets Requisitions Purchasing Payables; do
            dotnet run --project "tests/Services/$service/Matchbook.$service.UnitTests" --configuration Release --no-build
          done

  integration:
    name: integration (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite:
          - tests/Matchbook.BuildingBlocks.Tests
          - tests/Services/Suppliers/Matchbook.Suppliers.IntegrationTests
          - tests/Services/Budgets/Matchbook.Budgets.IntegrationTests
          - tests/Services/Requisitions/Matchbook.Requisitions.IntegrationTests
          - tests/Services/Purchasing/Matchbook.Purchasing.IntegrationTests
          - tests/Services/Payables/Matchbook.Payables.IntegrationTests
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Real Postgres and real RabbitMQ in containers. The claims under test are about the outbox, the inbox,
      # constraints and concurrency, and an in-memory substitute would prove none of them.
      - name: Integration tests
        run: dotnet run --project ${{ matrix.suite }} --configuration Release

  web:
    name: console (types, lint, unit, bundle, licences)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      # Vite strips types without checking them, so the type-check is its own step.
      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Build and bundle budget
        run: npm run build && npm run budget

      - name: Audit npm licences
        run: npm run licences

  system:
    name: system (compose stack, chaos, reconciliation, console journeys)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The README quick start, exactly as a reader runs it. If this breaks, the quick start is broken.
      - name: Start the stack
        run: docker compose up -d --build --wait

      # A purchase from request to payment, then thirty more while the broker restarts and the two services that
      # hold money are killed; after each, the five databases must reconcile to the cent.
      - name: System tests
        run: dotnet run --project tests/Matchbook.SystemTests

      - name: Install the console's tools
        working-directory: web
        run: npm ci && npx playwright install --with-deps chromium

      # The console's generated client against the documents the running services serve. A difference means the
      # contract moved and the console has not caught up.
      - name: Contract drift
        working-directory: web
        run: npx openapi-ts && npx prettier --check . && git diff --exit-code -- src/shared/api/generated

      # Every person's job in the browser, through the real Keycloak sign-in and the nginx container, with axe in
      # both appearances and the Content Security Policy enforced.
      - name: Console journeys
        working-directory: web
        run: npm run test:e2e

      - name: Journey report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

      - name: Service logs
        if: failure()
        run: docker compose logs --no-color --timestamps
