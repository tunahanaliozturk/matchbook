server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # The API on the console's own origin: no preflight on every request, and a Content Security Policy that names
    # only this origin and Keycloak. The gateway checks the token; nginx only forwards it.
    location /api/ {
        include /etc/nginx/security-headers.conf;
        proxy_pass http://gateway:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Replace any forwarding chain the caller supplied rather than passing their claim downstream.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed assets never change under the same name.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /health {
        access_log off;
        return 200 "ok\n";
    }

    # A single page application: any address the router owns arrives as the index, or a reload answers 404.
    location / {
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
