# Included in every location, because nginx drops server-level add_header directives in a location that sets its own.
# "always" covers error responses too.
#
# Scripts only from this origin, so an injected <script> cannot run and read the in-memory token (ADR 0009). Styles
# from this origin, plus inline style attributes, which Vue writes for bound widths such as the ledger capsule's.
# connect-src names Keycloak because the token endpoint is called from the page.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' http://localhost:8080; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
